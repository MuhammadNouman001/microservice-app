name: CI/CD Build and Push to AWS ECR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write # Required to request the OIDC JWT token
  contents: read # Required for actions/checkout

jobs:
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug OIDC Claims (Temporary)
        shell: bash
        run: |
          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          python3 - "$TOKEN" <<'PY'
          import sys, json, base64

          token = sys.argv[1]
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in [
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY
      # OIDC-based authentication — no long-lived access keys stored in secrets.
      # Requires a GitHub OIDC identity provider and an IAM role in your AWS account.
      # Setup guide: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================================
      # 1. Auth Service (Python 3.11 / FastAPI)
      # Build context: ./auth-service
      # All required files (requirements.txt, .env.example, app/) are
      # inside the auth-service directory. No root files needed.
      # ============================================================
      - name: Build & Push Auth Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/microservice-auth:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/microservice-auth:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # 2. Request Service (Python 3.11 / FastAPI + MongoDB)
      # Build context: ./request-service
      # All required files (requirements.txt, app/) are inside the
      # request-service directory. No root files needed.
      # ============================================================
      - name: Build & Push Request Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./request-service
          file: ./request-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/microservice-request:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/microservice-request:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # 3. Notification Service (Node.js 20 / NestJS)
      # Build context: ./notification-service
      # Dockerfile copies: package.json, pnpm-lock.yaml,
      # pnpm-workspace.yaml, .npmrc — all self-contained inside
      # the notification-service directory.
      # ============================================================
      - name: Build & Push Notification Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          file: ./notification-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/microservice-notification:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/microservice-notification:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
